services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ev_charger_emulator
      POSTGRES_PASSWORD: ev_charger_emulator
      POSTGRES_DB: ev_charger_emulator
    ports:
      - "5442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
